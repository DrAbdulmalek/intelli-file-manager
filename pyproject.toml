[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# ملاحظة (تفكيك ازدواجية الإعدادات — مراجعة التصلّد الشامل):
# إعدادات pytest كانت مكررة هنا ومع pytest.ini (الأخير له الأولوية عند
# وجود كليهما ويحتوي علامة desktop الإضافية) — القسم حُذف من هنا وpytest.ini
# هو المصدر الوحيد لإعدادات الاختبار.

[tool.ruff]
# تكوين موحّد لـruff — CI يفحص الأخطاء الجسيمة فقط (E9,F63,F7,F82,F821)؛
# فئات الأنماط (UP/BLE/...) قيد التبني التدريجي ولا تمنع الدمج حالياً.
line-length = 120
target-version = "py310"
extend-exclude = [
    "web",
    "mobile",
    "build",
    "dist",
    "venv",
    ".venv",
    "packaging",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F821"]
ignore = []
