name: CI — intelli-file-manager (fail-closed)

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'web/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'web/**'
      - 'tests/**'

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio httpx ruff mypy
          pip install -r requirements.txt

      # fail-closed على أخطاء الكود الجسيمة (syntax/undefined) دون فرض
      # إعادة كتابة أنماط الكود كلها دفعة واحدة (UP/BLE ممنوعة مؤقتاً)
      - name: Lint (serious error classes — blocking)
        run: ruff check src/ --select E9,F63,F7,F82,F821 --output-format=github

      - name: Type check (non-blocking — قائمة قصيرة تدريجية)
        run: mypy src/ --ignore-missing-imports
        continue-on-error: true

      # fail-closed: غياب الاختبارات فشل إجباري
      # ملاحظة: addopts يحوي -v فتأتي سطر الملخص محاطاً بحواف ==== —
      # لذلك نطابق "N tests collected" في أي مكان، ونُظهر مخرجات الجمع
      # بدل كتمها (2>/dev/null كان يخفي أخطاء الجمع نفسها)
      - name: Guard — tests must exist
        run: |
          python -m pytest tests/ --collect-only -q 2>&1 | tail -3
          COUNT=$(python -m pytest tests/ --collect-only -q 2>&1 | grep -oE '[0-9]+ tests? collected' | grep -oE '^[0-9]+' | head -1 || echo 0)
          echo "collected tests: $COUNT"
          if [ "$COUNT" -le 0 ]; then
            echo "::error::لم يُعثر على أي اختبار في tests/ — فشل إجباري (fail-closed)"
            exit 1
          fi

      # fail-closed: فشل أي اختبار يفشل الـworkflow — لا fallback ولا || true
      - name: Run tests
        run: |
          QT_QPA_PLATFORM=offscreen pytest tests/ -q --tb=short
      - name: Diagnostics — failed test summary (non-blocking)
        if: failure()
        run: |
          for f in .pytest_cache/v/cache/lastfailed; do
            [ -f "$f" ] && { echo "### Last-failed tests (persist cache)" >> "$GITHUB_STEP_SUMMARY"; cat "$f" >> "$GITHUB_STEP_SUMMARY"; }
          done

      # fail-closed: خادم الـAPI يجب أن يعمل ويجيب /api/health بصيغة صحيحة
      - name: Test API server startup (blocking)
        run: |
          set -e
          INTELLIFILE_LIGHTWEIGHT=1 timeout 20 uvicorn src.api.server:app --host 127.0.0.1 --port 8421 &
          SERVER_PID=$!
          for i in $(seq 1 15); do
            sleep 1
            if curl -fsS http://localhost:8421/api/health | grep -q '"status" *: *"ok"'; then
              echo "API health OK"
              kill $SERVER_PID 2>/dev/null || true
              exit 0
            fi
          done
          echo "::error::خادم الـAPI لم يستجب /api/health"
          kill $SERVER_PID 2>/dev/null || true
          exit 1

  frontend:
    runs-on: ubuntu-latest
    continue-on-error: true  # عمل غير ممنع حالياً — لا يخفي أي اختبار أمني (الاختبارات في backend)
    name: frontend (non-blocking)
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        run: npm ci || npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
