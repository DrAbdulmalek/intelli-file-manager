name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # pyaudio لا ينشر عجلات لينكس على PyPI -> يحتاج portaudio.h للبناء من المصدر
        sudo apt-get update -qq && sudo apt-get install -y -qq portaudio19-dev
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-asyncio httpx

    # fail-closed: غياب الاختبارات فشل — لا "No tests found" يخفيه
    # ملاحظة: addopts يحوي -v فتأتي سطر الملخص محاطاً بحواف ==== —
    # لذلك نطابق "N tests collected" في أي مكان، ونُظهر مخرجات الجمع
    # بدل كتمها (2>/dev/null كان يخفي أخطاء الجمع نفسها)
    - name: Guard — tests must exist
      run: |
        python -m pytest tests/ --collect-only -q 2>&1 | tail -3
        COUNT=$(python -m pytest tests/ --collect-only -q 2>&1 | grep -oE '[0-9]+ tests? collected' | grep -oE '^[0-9]+' | head -1 || echo 0)
        echo "collected tests: $COUNT"
        if [ "$COUNT" -le 0 ]; then
          echo "::error::لم يُعثر على أي اختبار في tests/ — فشل إجباري (fail-closed)"
          exit 1
        fi

    # fail-closed: فشل أي اختبار يفشل الـworkflow — لا fallback ولا || true
    - name: Run tests
      run: |
        QT_QPA_PLATFORM=offscreen python -m pytest tests/ -q --tb=short

    - name: Static analysis (serious error classes — blocking)
      run: |
        pip install flake8
        # E9: syntax, F63: confusion, F7: syntax-ish, F82: undefined name
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Formatting check (black — non-blocking، لإعادة التنسيق تدريجياً)
      run: |
        pip install black
        black . --check --verbose
      continue-on-error: true
